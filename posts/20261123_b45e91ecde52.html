<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微光也足以照亮前路</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;font:18px/1.8 system-ui;color:#222}img{max-width:100%;height:auto}</style></head><body><article><h1>微光也足以照亮前路</h1><p>微光也足以照亮前路</p><p>不必苛求自己一开始就光芒万丈。哪怕是一点点微小的坚持，只要每天都在往前走，日积月累之后，也会汇成足以温暖自己的光亮。</p></article></body></html>
