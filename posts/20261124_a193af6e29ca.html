<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真正厉害的人，都在默默打磨自己的基本功</title><style>body{max-width:760px;margin:40px auto;padding:0 20px;font:18px/1.8 system-ui;color:#222}img{max-width:100%;height:auto}</style></head><body><article><h1>真正厉害的人，都在默默打磨自己的基本功</h1><p>真正厉害的人，都在默默打磨自己的基本功</p><p>浮躁的时代里，人人都想走捷径，但能走远的路从来没有捷径。每天比昨天多弄懂一个小细节，多写几行踏实的文字，时间久了，积累自会替你说话。</p></article></body></html>
